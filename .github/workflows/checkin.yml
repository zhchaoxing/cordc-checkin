name: CordCloud Check-in

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 09:00 北京时间
  workflow_dispatch:

concurrency:
  group: cordcloud-checkin
  cancel-in-progress: false

jobs:
  checkin:
    # 本机 self-hosted runner —— 固定 IP，SSPanel 会话才有效
    runs-on: [self-hosted, cordc-sg]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run check-in
        run: |
          set -a
          [ -f "$HOME/.config/cordc/creds.env" ] && . "$HOME/.config/cordc/creds.env" || true
          set +a
          export CC_COOKIE_FILE="$HOME/.config/cordc/cookie.txt"
          export CC_HOST=cordc.net
          python3 checkin.py
