name: CordCloud Check-in

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: cordcloud-checkin
  cancel-in-progress: false

jobs:
  checkin:
    # 跑在本机 self-hosted runner（固定 IP，cookie 才有效）
    runs-on: [self-hosted, cordc-sg]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run check-in (cookie mode)
        env:
          # 持久 cookie 文件（由一次性登录助手写入，之后自动刷新续期）
          CC_COOKIE_FILE: /home/ubuntu/.config/cordc/cookie.txt
          CC_HOST: cordc.net
        run: python3 checkin.py
